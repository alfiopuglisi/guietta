name: pytest
on:
  pull_request:
  push:
  #  branches: [master]
jobs:
  run_pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        qt_api: [pyside6, pyqt6, pyqt5]
    env:
      QT_API: ${{ matrix.qt_api }}
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libdbus-1-3 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xinput0 libxcb-xfixes0
      - run: pip install pytest
      - run: pip install -r requirements_github.txt
      - run: pip install ${{ matrix.qt_api }}
      - run: pytest
